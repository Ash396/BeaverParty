# Runs the tests on every push and pull request. On main, also builds the
# Docker image and publishes it to ghcr.io/ash396/beaverparty for Hyades.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests only check that the image builds.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/ash396/beaverparty:latest
            ghcr.io/ash396/beaverparty:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Ash396/BeaverParty
